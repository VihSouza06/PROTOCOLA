<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PROTOCOLA</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-titulo">
            <img src="/images/logo_colorida.png" alt="Protocola" style="max-width: 300px; margin-bottom: 0.5rem;">
        </div>

        <div id="alerta" class="alerta"></div>

        <form id="form-login">
            <div class="form-group">
                <label for="login">Login</label>
                <input type="text" id="login" placeholder="Seu login" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>
            <button type="submit" id="btn-entrar" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
                Entrar
            </button>
        </form>

        <div class="auth-rodape">
            Não tem conta? <a href="/cadastro.html">Cadastre-se</a>
        </div>
    </div>
</div>

<script src="/api.js"></script>
<script>
    // Se já logado, redireciona
    fetch('/api/auth/me', { credentials: 'include' })
        .then(r => r.ok ? r.json() : null)
        .then(u => { if (u) window.location.href = u.role === 'GESTOR' ? '/home_gestor.html' : '/home_cidadao.html'; });

    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        esconderAlerta('alerta');
        const btn = document.getElementById('btn-entrar');
        btn.disabled = true; btn.textContent = 'Entrando...';

        const { ok, data } = await login(
            document.getElementById('login').value.trim(),
            document.getElementById('password').value
        );

        if (ok) {
            window.location.href = data.role === 'GESTOR' ? '/home_gestor.html' : '/home_cidadao.html';
        } else {
            mostrarAlerta('alerta', data.erro || 'Erro ao fazer login.', 'erro');
            btn.disabled = false; btn.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
